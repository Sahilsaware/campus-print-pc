<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin Login - Campus Print</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="kiosk-container login-wrap">
    <div class="header-section"><h1>Campus Print Admin</h1></div>
    <div class="kiosk-card">
        <form method="post" action="/admin/login" autocomplete="on">
            {% if error %}<p class="status-msg error" role="alert">{{ error }}</p>{% endif %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="btn-row"><button class="btn" type="submit">Log in</button></div>
        </form>
    </div>
    <p class="footer"><a href="/">&larr; Back to Campus Print</a></p>
</div>
</body>
</html>
